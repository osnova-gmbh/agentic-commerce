[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "buyer-agent"
version = "0.1.25"
description = "Cloneable reference resident agent for the Cogit runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentdb-client==0.2.13",
    "cogit-agent-sdk==0.5.16",
    "cogit-runtime==0.3.31",
    "cogit-tool-core[sdk]==0.1.3",
    "pyyaml>=6.0",
    "pydantic>=2.7,<3",
    "cogit-finance-seams==0.1.0",
    "cogit-messaging-shim==0.1.0",
    "cryptography>=42",
    "httpx>=0.27",
]

[project.scripts]
cogit-agent-setup = "buyer_agent_setup:main"

[project.optional-dependencies]
workspace = [
    "cogit-agent-sdk[openai]==0.5.16",
    "cogit-tool-browser[sdk]==0.1.2",
    "cogit-tool-execution[provider]==0.1.1",
    "cogit-tool-filesystem[provider]==0.1.1",
    "cogit-tool-shell[provider]==0.1.2",
    "cogit-transport-browser-session==0.1.0",
]
dev = [
    "deptry>=0.20",
    "httpx>=0.27",
    "import-linter>=2.0",
    "jsonschema>=4.23",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "deptry>=0.20",
    "httpx>=0.27",
    "import-linter>=2.0",
    "jsonschema>=4.23",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.uv]
# Build closure is recorded separately in vendor/build-toolchain.json.
build-constraint-dependencies = [
    "hatchling==1.32.3",
    "packaging==26.2",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]

[tool.uv.sources]
cogit-messaging-shim = { path = "vendor/wheels/cogit_messaging_shim-0.1.0-py3-none-any.whl" }
cogit-finance-seams = { path = "vendor/wheels/cogit_finance_seams-0.1.0-py3-none-any.whl" }
# Source-reviewed local cohort; see vendor/wheels/PROVENANCE.md before promotion.
agentdb-client = { path = "vendor/wheels/agentdb_client-0.2.13-py3-none-any.whl" }
cogit-agent-sdk = { path = "vendor/wheels/cogit_agent_sdk-0.5.16-py3-none-any.whl" }
cogit-runtime = { path = "vendor/wheels/cogit_runtime-0.3.31-py3-none-any.whl" }

cogit-tool-core = { path = "vendor/wheels/cogit_tool_core-0.1.3-py3-none-any.whl" }
cogit-tool-browser = { path = "vendor/wheels/cogit_tool_browser-0.1.2-py3-none-any.whl" }
cogit-tool-execution = { path = "vendor/wheels/cogit_tool_execution-0.1.1-py3-none-any.whl" }
cogit-tool-filesystem = { path = "vendor/wheels/cogit_tool_filesystem-0.1.1-py3-none-any.whl" }
cogit-tool-shell = { path = "vendor/wheels/cogit_tool_shell-0.1.2-py3-none-any.whl" }
cogit-transport-browser-session = { path = "vendor/wheels/cogit_transport_browser_session-0.1.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
# Hatch includes SQL/JSON under the package; wheel tests verify these resources.
packages = ["src/buyer_agent", "src/buyer_agent_setup"]

[tool.hatch.build.targets.wheel.force-include]
"src/buyer_agent/py.typed" = "buyer_agent/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".venv",
    ".factory-spaces",
    ".factory-logs",
    ".ci-deps",
    ".build-deps",
    ".quality",
]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "S",
    "UP",
    "W",
]
ignore = ["S101"]

[tool.pyright]
include = ["src", "scripts", "examples", "main.py"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.deptry]
known_first_party = ["buyer_agent", "buyer_agent_setup"]
extend_exclude = ["tests", "scripts", "main.py", ".ci-deps", ".build-deps", ".quality", ".factory-spaces", ".factory-logs"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "cogit-tool-browser",
    "cogit-tool-execution",
    "cogit-tool-filesystem",
    "cogit-tool-shell",
    "cogit-transport-browser-session",
    "cogit-runtime",
    "cryptography",
    "deptry",
    "httpx",
    "import-linter",
    "jsonschema",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "ruff",
]
