[project]
name = "cogit-messaging-shim"
version = "0.2.1"
description = "In-repo stand-in for the SDK messaging seam: signed envelopes, send() and the delivery loop."
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "cogit-finance-seams"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogit_messaging_shim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
