[project]
name = "cogit-finance-seams"
version = "0.2.1"
description = "Ports between the escrow demo code and its hosts (AgentDb modules, artifacts, work admission, bank), with in-process stand-ins."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogit_finance_seams"]

[tool.pytest.ini_options]
testpaths = ["tests"]
