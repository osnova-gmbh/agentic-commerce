  version: 1.1.7
  artifact_sha256: 196599525d5555cec61c5a3685f43fc274ecde32fe5bca92c66147d383b300ea
  exports:
  - kind: query
    key: requests.get
    export_version: 1.0.0
    contract_id: cogit.cogit-finance.requests.get.v1
  - kind: command
    key: requests.put
    export_version: 1.0.0
    contract_id: cogit.cogit-finance.requests.put.v1
  - kind: command
    key: resolutions.apply
    export_version: 1.0.0
    contract_id: cogit.cogit-finance.resolutions.apply.v1
  - kind: query
    key: resolutions.list
    export_version: 1.0.0
    contract_id: cogit.cogit-finance.resolutions.list.v1
