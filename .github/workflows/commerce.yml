name: Commerce acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMMERCE_SQL_TEST_DSN: postgresql://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/dev-install.sh
      - run: uv pip install --python .venv/bin/python pytest-asyncio psycopg2-binary ruff pyright
      - run: .venv/bin/python scripts/check_commerce.py --require-native
      - run: node --test apps/dashboard/tests/checkout-selection.test.mjs
      - name: Build commerce packages
        run: |
          for project in packages/* modules/* agents/* apps/*; do
            if test -f "$project/pyproject.toml"; then
              uv build --wheel --project "$project" --out-dir "$RUNNER_TEMP/commerce-wheels"
            fi
          done
      - name: Escrow static checks
        run: |
          .venv/bin/pyright --project pyright-commerce.json --pythonpath .venv/bin/python
          .venv/bin/ruff check packages/cogit-finance/src/cogit_finance/escrow
          .venv/bin/ruff format --check packages/cogit-finance/src/cogit_finance/escrow
