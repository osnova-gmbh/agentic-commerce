name: Commerce API and MCP
on:
  push:
    branches: ["feat/discoverable-commerce-api"]
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "scripts/run_mcp.py"
      - "tests/e2e/test_api_discovery.py"
      - "tests/e2e/test_commerce_mcp.py"
      - ".agents/skills/use-agentic-commerce/**"
      - ".github/workflows/commerce-api.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install "mcp==1.26.0" fastapi uvicorn pytest pytest-asyncio httpx pyyaml cryptography jsonschema \
            agents/buyer-agent/vendor/wheels/cogit_agent_sdk-0.5.16-py3-none-any.whl \
            agents/buyer-agent/vendor/wheels/cogit_tool_core-0.1.3-py3-none-any.whl \
            agents/buyer-agent/vendor/wheels/agentdb_client-0.2.13-py3-none-any.whl \
            agents/buyer-agent/vendor/wheels/cogit_runtime-0.3.31-py3-none-any.whl
      - name: Validate contracts and MCP checkout
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from run_demo import configure_paths
          configure_paths()
          os.environ["PYTHONPATH"] = os.pathsep.join(sys.path)
          import pytest
          raise SystemExit(pytest.main([
              "tests/e2e/test_api_discovery.py",
              "tests/e2e/test_commerce_mcp.py",
              "tests/e2e/test_catalog_checkout.py",
              "tests/e2e/test_boris_runtime.py",
              "apps/dashboard/tests",
              "-q",
          ]))
          PY
      - name: Validate portable skill
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          root = Path(".agents/skills/use-agentic-commerce")
          content = (root / "SKILL.md").read_text()
          meta = yaml.safe_load(content.split("---", 2)[1])
          assert meta["name"] == "use-agentic-commerce"
          assert meta["description"] and set(meta) == {"name", "description"}
          assert "TODO" not in content
          assert (root / "references/commerce-api.md").is_file()
          interface = yaml.safe_load((root / "agents/openai.yaml").read_text())["interface"]
          assert "$use-agentic-commerce" in interface["default_prompt"]
          PY
      - name: Check dashboard scripts
        run: node --test apps/dashboard/tests/checkout-selection.test.mjs
