[project]
name = "dashboard"
version = "0.1.0"
description = "Read-only view of escrow deals for the live demo: ten-step strip, event log, verdicts and money."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "cogit-finance-seams"]

[project.optional-dependencies]
test = ["pytest", "httpx>=0.27"]
fixtures = ["cogit-messaging-shim"]  # only to regenerate the fixture sets

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
