[project]
name = "sim-bank"
version = "0.1.0"
description = "Simulated partner bank for the escrow demo: idempotent transfers, lookup by key and credit events with stable IDs."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest", "httpx>=0.27", "cogit-finance-seams"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
