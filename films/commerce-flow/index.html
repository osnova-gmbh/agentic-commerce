<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>From discovery to settlement | Cogit Finance</title>
  <style>
    @font-face{font-family:Manrope;src:url('/assets/manrope-latin.woff2')}*{box-sizing:border-box}
    body{margin:0;background:#102b23;color:#edf4ed;font:15px/1.6 Manrope,Arial,sans-serif}
    main{max-width:1320px;margin:auto;padding:36px 32px}.brand{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#a9c6b3}
    h1{font-size:clamp(28px,4vw,47px);line-height:1.15;letter-spacing:-1px;margin:15px 0 12px;font-weight:600}
    .intro{color:#b8cebf;margin:0 0 25px}video{display:block;width:100%;aspect-ratio:16/9;background:#f4f7f3;border-radius:9px;box-shadow:0 22px 65px #001c1540}
    nav{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}button,a{font:inherit}button{background:#1f4234;border:1px solid #406451;color:#e5eee5;padding:8px 15px;border-radius:5px;cursor:pointer}button:hover,button.active{background:#d9e9d4;color:#153b29}
    footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #315241;padding-top:18px;color:#a9c6b3;font-size:12px}a{color:#e0edce;text-decoration:underline;text-underline-offset:4px}:focus-visible{outline:3px solid #dbbf75;outline-offset:4px}
    @media(max-width:600px){main{padding:24px 16px}nav{gap:7px}button{padding:7px 10px;font-size:12px}footer{flex-direction:column}}
  </style>
</head>
<body><main>
  <div class="brand">cogit / finance</div>
  <h1>From discovery to settlement.</h1>
  <p class="intro">Follow the requests, signed messages, bank confirmations and independent delivery checks.</p>
  <video id="film" controls playsinline preload="metadata" poster="/poster.png" src="/video.mp4"></video>
  <nav aria-label="Film chapters">
    <button data-time="0">Discovery</button><button data-time="8">Request</button>
    <button data-time="15">Agreement</button><button data-time="23">Funding</button>
    <button data-time="32">Delivery</button><button data-time="38">Evaluation</button>
    <button data-time="46">Settlement</button><button data-time="57">Result</button>
  </nav>
  <footer><span>62 seconds · 1080p · Illustrative playback of the demo protocol</span>
    <span><a href="/video.mp4" download="commerce-flow.mp4">Download MP4</a> · <a href="/commerce-flow.html">Editable animation</a></span></footer>
</main>
<script>
const film=document.getElementById('film'), chapters=[...document.querySelectorAll('button[data-time]')];
for(const button of chapters)button.addEventListener('click',()=>{film.currentTime=Number(button.dataset.time);film.play().catch(()=>{});});
film.addEventListener('timeupdate',()=>{chapters.forEach((button,index)=>button.classList.toggle('active',film.currentTime>=Number(button.dataset.time)&&(!chapters[index+1]||film.currentTime<Number(chapters[index+1].dataset.time))));});
</script>
</body></html>
