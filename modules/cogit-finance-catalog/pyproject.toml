[project]
name = "cogit-finance-catalog"
version = "0.1.0"
description = "Reference implementation of the cogit-finance-catalog module: companies, offers and evaluators."
requires-python = ">=3.10"
dependencies = ["cogit-finance-seams"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogit_finance_catalog_module"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "cogit_finance_catalog_module/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
