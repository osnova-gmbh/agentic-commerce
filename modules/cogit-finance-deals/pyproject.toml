[project]
name = "cogit-finance-deals"
version = "0.1.0"
description = "Reference implementation of the cogit-finance-deals module: hash-chained deal log, outbox, payment intents and ledger."
requires-python = ">=3.10"
dependencies = ["cogit-finance-seams"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogit_finance_deals_module"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "cogit_finance_deals_module/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
